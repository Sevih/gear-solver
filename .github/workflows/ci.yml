name: CI

# Typecheck + tests of every workspace, on each PR and each push to main.
# Linux is the dev platform, Windows the one the app ships on: both run.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR/branch supersedes the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Neither typecheck nor the tests launch Electron: skip its ~100 MB download.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npm run typecheck

      - run: npm test
