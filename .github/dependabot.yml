version: 2
updates:
  # Dépendances npm des trois workspaces : le lockfile unique de la racine
  # (`package-lock.json`, avec les `workspaces` du `package.json` racine) les
  # couvre tous, d'où `directory: '/'`. Une PR ne lance que `ci.yml`
  # (typecheck, lint, tests sur Linux et Windows) : rien n'est publié au merge,
  # la release reste un geste manuel (`npm run release`, qui revérifie tout).
  # Pas de liste `ignore` : Electron, electron-builder, Vite, React et ESLint
  # compris, chaque PR est jugée à part.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    # Un seul PR hebdo pour les bumps minor/patch ; les majors arrivent une par
    # une, pour être regardées seules.
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    commit-message:
      prefix: 'chore(deps)'

  # Mises à jour des actions GitHub épinglées par SHA dans les workflows.
  # Dependabot réécrit le SHA ET le commentaire de version : garder la forme
  # `@<sha> # vX.Y.Z` de ci.yml et publish-wiki.yml telle quelle.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    # Même regroupement : minor/patch ensemble, chaque major à part.
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    commit-message:
      prefix: 'ci(deps)'
